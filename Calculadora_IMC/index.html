    <!DOCTYPE html>
    <html lang="es">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora IMC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
        /* ── Reset & Variables ──────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
        --bg:        #0a0a0a;
        --surface:   #131313;
        --surface2:  #1a1a1a;
        --border:    #252525;
        --accent:    #c8f55a;
        --accent2:   #5af5c0;
        --danger:    #f55a5a;
        --text:      #f0f0f0;
        --muted:     #666;
        --radius:    12px;

        /* IMC colors */
        --c-delgadez-severa: #ff4444;
        --c-delgadez:        #ff8c00;
        --c-bajo-peso:       #ffd700;
        --c-normal:          #c8f55a;
        --c-sobrepeso:       #ff8c00;
        --c-obesidad1:       #ff6b35;
        --c-obesidad2:       #ff4444;
        --c-obesidad3:       #cc0000;
        }

        html, body {
        height: 100%;
        font-family: 'Syne', sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        user-select: none;
        }

        /* ── Titlebar ───────────────────────────────── */
        #titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 42px;
        padding: 0 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
        }
        #titlebar .logo {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--accent);
        }
        .win-controls { display: flex; gap: 8px; -webkit-app-region: no-drag; }
        .win-btn {
        width: 13px; height: 13px;
        border-radius: 50%; border: none; cursor: pointer;
        transition: opacity .15s;
        }
        .win-btn:hover { opacity: .75; }
        #btn-close    { background: #ff5f57; }
        #btn-minimize { background: #febc2e; }

        /* ── Layout ─────────────────────────────────── */
        #app {
        display: grid;
        grid-template-columns: 340px 1fr;
        height: calc(100vh - 42px);
        }

        /* ── Left Panel ─────────────────────────────── */
        #panel-left {
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 28px 24px;
        gap: 20px;
        overflow-y: auto;
        }

        h1 {
        font-size: 26px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -.02em;
        }
        h1 span { color: var(--accent); }

        .subtitle {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: .08em;
        text-transform: uppercase;
        }

        /* ── Form ───────────────────────────────────── */
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--muted);
        }
        input {
        background: var(--surface2);
        border: 1.5px solid var(--border);
        border-radius: 8px;
        padding: 11px 14px;
        color: var(--text);
        font-family: 'Syne', sans-serif;
        font-size: 15px;
        outline: none;
        transition: border-color .2s;
        -webkit-app-region: no-drag;
        }
        input:focus { border-color: var(--accent); }
        input::placeholder { color: #444; }

        input[type=number] {
        font-family: 'DM Mono', monospace;
        font-size: 18px;
        }

        .unit {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        color: #555;
        align-self: flex-end;
        margin-top: -2px;
        }

        /* ── Button ─────────────────────────────────── */
        #btn-calc {
        margin-top: 4px;
        padding: 14px;
        background: var(--accent);
        color: #0a0a0a;
        border: none;
        border-radius: 10px;
        font-family: 'Syne', sans-serif;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: .06em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform .15s, opacity .15s;
        -webkit-app-region: no-drag;
        }
        #btn-calc:hover  { opacity: .88; }
        #btn-calc:active { transform: scale(.97); }

        /* ── Result Card ────────────────────────────── */
        #result-card {
        background: var(--surface2);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        display: none;
        flex-direction: column;
        gap: 10px;
        animation: fadeUp .3s ease;
        }
        #result-card.visible { display: flex; }

        @keyframes fadeUp {
        from { opacity:0; transform:translateY(8px); }
        to   { opacity:1; transform:translateY(0); }
        }

        .result-name {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .06em;
        color: var(--muted);
        text-transform: uppercase;
        }

        .result-imc {
        font-family: 'DM Mono', monospace;
        font-size: 48px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -.03em;
        }

        .result-badge {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 100px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        width: fit-content;
        }

        .result-detail {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
        }

        /* ── IMC Scale ──────────────────────────────── */
        .imc-scale {
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(to right,
            #ff4444 0%,
            #ff8c00 15%,
            #ffd700 22%,
            #c8f55a 38%,
            #c8f55a 50%,
            #ff8c00 62%,
            #ff6b35 75%,
            #ff4444 88%,
            #cc0000 100%
        );
        position: relative;
        margin-top: 4px;
        }
        .scale-marker {
        position: absolute;
        top: -4px;
        width: 16px; height: 16px;
        background: white;
        border-radius: 50%;
        border: 2.5px solid #0a0a0a;
        transform: translateX(-50%);
        transition: left .5s cubic-bezier(.34,1.56,.64,1);
        box-shadow: 0 0 0 3px var(--accent);
        }
        .scale-labels {
        display: flex;
        justify-content: space-between;
        font-family: 'DM Mono', monospace;
        font-size: 9px;
        color: var(--muted);
        margin-top: 5px;
        }

        /* ── Right Panel ────────────────────────────── */
        #panel-right {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        }

        .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 28px 16px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        }
        .panel-header h2 {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--muted);
        }
        #count-badge {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 100px;
        padding: 3px 10px;
        color: var(--muted);
        }
        #btn-export {
        background: transparent;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 7px 14px;
        font-family: 'Syne', sans-serif;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color .2s, color .2s;
        -webkit-app-region: no-drag;
        letter-spacing: .05em;
        }
        #btn-export:hover { border-color: var(--accent2); color: var(--accent2); }

        /* ── Records List ───────────────────────────── */
        #records-list {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        }
        #records-list::-webkit-scrollbar { width: 4px; }
        #records-list::-webkit-scrollbar-track { background: transparent; }
        #records-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--muted);
        }
        .empty-icon { font-size: 40px; opacity: .3; }
        .empty-state p { font-family:'DM Mono',monospace; font-size:12px; }

        /* ── Record Item ────────────────────────────── */
        .record-item {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 12px;
        animation: fadeUp .25s ease;
        transition: border-color .2s;
        }
        .record-item:hover { border-color: #333; }

        .rec-main { display: flex; align-items: center; gap: 14px; }
        .rec-avatar {
        width: 36px; height: 36px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 15px;
        font-weight: 800;
        flex-shrink: 0;
        }
        .rec-info { display: flex; flex-direction: column; gap: 2px; }
        .rec-name { font-size: 14px; font-weight: 700; }
        .rec-meta {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        color: var(--muted);
        }
        .rec-right { display: flex; align-items: center; gap: 10px; }
        .rec-imc {
        font-family: 'DM Mono', monospace;
        font-size: 22px;
        font-weight: 500;
        text-align: right;
        }
        .rec-badge {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 100px;
        letter-spacing: .06em;
        text-transform: uppercase;
        white-space: nowrap;
        }
        .btn-delete {
        background: transparent;
        border: none;
        color: #444;
        cursor: pointer;
        font-size: 16px;
        padding: 4px;
        border-radius: 6px;
        transition: color .2s, background .2s;
        -webkit-app-region: no-drag;
        line-height: 1;
        }
        .btn-delete:hover { color: var(--danger); background: rgba(245,90,90,.1); }

        /* ── Toast ──────────────────────────────────── */
        #toast {
        position: fixed;
        bottom: 24px; left: 50%;
        transform: translateX(-50%) translateY(60px);
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 13px;
        font-weight: 600;
        transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
        opacity: 0;
        pointer-events: none;
        z-index: 999;
        white-space: nowrap;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
    </head>
    <body>

    <!-- Titlebar -->
    <div id="titlebar">
    <span class="logo">⬤ IMC Calculator</span>
    <div class="win-controls">
        <button class="win-btn" id="btn-minimize"></button>
        <button class="win-btn" id="btn-close"></button>
    </div>
    </div>

    <!-- Main App -->
    <div id="app">

    <!-- Left: Calculator -->
    <div id="panel-left">
        <div>
        <h1>Calcula tu<br><span>IMC</span></h1>
        <p class="subtitle" style="margin-top:6px">Índice de Masa Corporal</p>
        </div>

        <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="inp-nombre" placeholder="Ej. Juan Pérez" autocomplete="off" />
        </div>

        <div class="form-group">
        <label>Peso</label>
        <input type="number" id="inp-peso" placeholder="70" min="1" max="500" step="0.1" />
        <span class="unit">kilogramos (kg)</span>
        </div>

        <div class="form-group">
        <label>Altura</label>
        <input type="number" id="inp-altura" placeholder="170" min="50" max="250" step="0.1" />
        <span class="unit">centímetros (cm)</span>
        </div>

        <button id="btn-calc">Calcular IMC</button>

        <!-- Result -->
        <div id="result-card">
        <div class="result-name" id="res-nombre"></div>
        <div class="result-imc" id="res-imc"></div>
        <div class="result-badge" id="res-badge"></div>
        <div class="result-detail" id="res-detail"></div>
        <div class="imc-scale">
            <div class="scale-marker" id="scale-marker"></div>
        </div>
        <div class="scale-labels">
            <span>10</span><span>18.5</span><span>25</span><span>30</span><span>35</span><span>40+</span>
        </div>
        </div>
    </div>

    <!-- Right: History -->
    <div id="panel-right">
        <div class="panel-header">
        <div style="display:flex;align-items:center;gap:10px">
            <h2>Historial</h2>
            <span id="count-badge">0 registros</span>
        </div>
        <button id="btn-export">↓ Exportar CSV</button>
        </div>
        <div id="records-list">
        <div class="empty-state" id="empty-state">
            <div class="empty-icon">📋</div>
            <p>No hay registros aún</p>
        </div>
        </div>
    </div>

    </div>

    <div id="toast"></div>

    <script>
    // ── IMC Classification ────────────────────────────────────────────────────────

    const CLASIFICACIONES = [
    { min: 0,    max: 16,       label: 'Delgadez Severa',    desc: 'Desnutrición grave. Se recomienda atención médica urgente.',                     color: '#ff4444', bg: 'rgba(255,68,68,.15)',   emoji: '🔴' },
    { min: 16,   max: 17,       label: 'Delgadez Moderada',  desc: 'Bajo peso moderado. Consultar con un nutriólogo o médico.',                      color: '#ff6b35', bg: 'rgba(255,107,53,.15)', emoji: '🟠' },
    { min: 17,   max: 18.5,     label: 'Bajo Peso',          desc: 'Ligeramente por debajo del peso saludable.',                                     color: '#ffd700', bg: 'rgba(255,215,0,.15)',  emoji: '🟡' },
    { min: 18.5, max: 25,       label: 'Peso Normal',        desc: '¡Excelente! Peso dentro del rango saludable recomendado.',                       color: '#c8f55a', bg: 'rgba(200,245,90,.15)', emoji: '🟢' },
    { min: 25,   max: 30,       label: 'Sobrepeso',          desc: 'Peso ligeramente elevado. Se recomienda actividad física y dieta balanceada.',    color: '#ff8c00', bg: 'rgba(255,140,0,.15)',  emoji: '🟡' },
    { min: 30,   max: 35,       label: 'Obesidad Grado I',   desc: 'Obesidad leve. Riesgo moderado de enfermedades metabólicas.',                    color: '#ff6b35', bg: 'rgba(255,107,53,.15)', emoji: '🟠' },
    { min: 35,   max: 40,       label: 'Obesidad Grado II',  desc: 'Obesidad severa. Riesgo elevado. Consultar a un médico.',                        color: '#ff4444', bg: 'rgba(255,68,68,.15)',  emoji: '🔴' },
    { min: 40,   max: Infinity, label: 'Obesidad Grado III', desc: 'Obesidad mórbida. Alto riesgo de complicaciones. Atención médica necesaria.',    color: '#cc0000', bg: 'rgba(204,0,0,.15)',    emoji: '🔴' }
    ];

    function getClasificacion(imc) {
    return CLASIFICACIONES.find(c => imc >= c.min && imc < c.max) || CLASIFICACIONES[CLASIFICACIONES.length - 1];
    }

    function imcToPercent(imc) {
    const MIN = 10, MAX = 42;
    return Math.min(100, Math.max(0, ((imc - MIN) / (MAX - MIN)) * 100));
    }

    function getInitials(name) {
    return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    }

    function formatDate(iso) {
    return new Date(iso).toLocaleDateString('es-MX', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
    }

    // ── Estado ────────────────────────────────────────────────────────────────────
    let records = [];

    // ── Referencias DOM ───────────────────────────────────────────────────────────
    const inpNombre   = document.getElementById('inp-nombre');
    const inpPeso     = document.getElementById('inp-peso');
    const inpAltura   = document.getElementById('inp-altura');
    const btnCalc     = document.getElementById('btn-calc');
    const resultCard  = document.getElementById('result-card');
    const resNombre   = document.getElementById('res-nombre');
    const resImc      = document.getElementById('res-imc');
    const resBadge    = document.getElementById('res-badge');
    const resDetail   = document.getElementById('res-detail');
    const scaleMarker = document.getElementById('scale-marker');
    const recordsList = document.getElementById('records-list');
    const emptyState  = document.getElementById('empty-state');
    const countBadge  = document.getElementById('count-badge');
    const btnExport   = document.getElementById('btn-export');
    const btnClose    = document.getElementById('btn-close');
    const btnMinimize = document.getElementById('btn-minimize');
    const toast       = document.getElementById('toast');

    // ── Toast ─────────────────────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg, color = '#c8f55a') {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.style.color = color;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    // ── Controles de ventana ──────────────────────────────────────────────────────
    btnClose.addEventListener('click',    () => window.imc.closeWindow());
    btnMinimize.addEventListener('click', () => window.imc.minimizeWindow());

    // ── Calcular IMC ──────────────────────────────────────────────────────────────
    btnCalc.addEventListener('click', calcular);
    [inpNombre, inpPeso, inpAltura].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') calcular(); })
    );

    async function calcular() {
    const nombre = inpNombre.value.trim();
    const peso   = parseFloat(inpPeso.value);
    const altura = parseFloat(inpAltura.value);

    // Validaciones
    if (!nombre) {
        inpNombre.focus();
        inpNombre.style.borderColor = '#ff4444';
        setTimeout(() => inpNombre.style.borderColor = '', 1500);
        showToast('⚠️  Ingresa el nombre de la persona', '#ff8c00');
        return;
    }
    if (!peso || peso <= 0 || peso > 500) {
        inpPeso.focus();
        inpPeso.style.borderColor = '#ff4444';
        setTimeout(() => inpPeso.style.borderColor = '', 1500);
        showToast('⚠️  Ingresa un peso válido (kg)', '#ff8c00');
        return;
    }
    if (!altura || altura < 50 || altura > 250) {
        inpAltura.focus();
        inpAltura.style.borderColor = '#ff4444';
        setTimeout(() => inpAltura.style.borderColor = '', 1500);
        showToast('⚠️  Ingresa una altura válida (cm)', '#ff8c00');
        return;
    }

    // Cálculo
    const alturaM = altura / 100;
    const imc     = peso / (alturaM * alturaM);
    const imcStr  = imc.toFixed(2);
    const cls     = getClasificacion(imc);

    // Mostrar resultado en el panel izquierdo
    resNombre.textContent       = nombre.toUpperCase();
    resImc.textContent          = imcStr;
    resImc.style.color          = cls.color;
    resBadge.textContent        = `${cls.emoji}  ${cls.label}`;
    resBadge.style.background   = cls.bg;
    resBadge.style.color        = cls.color;
    resDetail.innerHTML         = `${cls.desc}<br><span style="color:#555">Peso: ${peso} kg · Altura: ${altura} cm</span>`;

    // Mover aguja de la escala
    const pct = imcToPercent(imc);
    scaleMarker.style.left      = `${pct}%`;
    scaleMarker.style.boxShadow = `0 0 0 3px ${cls.color}`;

    // Hacer visible la tarjeta de resultado
    resultCard.classList.add('visible');

    // Guardar registro en archivo
    const record = {
        id:            crypto.randomUUID(),
        nombre,
        peso,
        altura,
        imc:           imcStr,
        clasificacion: cls.label,
        color:         cls.color,
        bg:            cls.bg,
        emoji:         cls.emoji,
        fecha:         new Date().toISOString()
    };

    const result = await window.imc.saveRecord(record);
    if (result.success) {
        records.unshift(record);
        renderRecords();
        showToast(`✓  Registro guardado para ${nombre}`);
    } else {
        showToast('✗  Error al guardar', '#ff4444');
    }
    }

    // ── Renderizar historial ──────────────────────────────────────────────────────
    function renderRecords() {
    countBadge.textContent = `${records.length} registro${records.length !== 1 ? 's' : ''}`;
    [...recordsList.querySelectorAll('.record-item')].forEach(el => el.remove());

    if (records.length === 0) {
        emptyState.style.display = 'flex';
        return;
    }
    emptyState.style.display = 'none';

    records.forEach(r => {
        const item = document.createElement('div');
        item.className = 'record-item';
        item.dataset.id = r.id;
        item.innerHTML = `
        <div class="rec-main">
            <div class="rec-avatar" style="background:${r.bg};color:${r.color}">${getInitials(r.nombre)}</div>
            <div class="rec-info">
            <div class="rec-name">${r.nombre}</div>
            <div class="rec-meta">${r.peso} kg · ${r.altura} cm · ${formatDate(r.fecha)}</div>
            </div>
        </div>
        <div class="rec-right">
            <div>
            <div class="rec-imc" style="color:${r.color}">${r.imc}</div>
            <div class="rec-badge" style="background:${r.bg};color:${r.color}">${r.emoji} ${r.clasificacion}</div>
            </div>
            <button class="btn-delete" data-id="${r.id}" title="Eliminar">✕</button>
        </div>
        `;
        recordsList.appendChild(item);
    });

    recordsList.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', async e => {
        e.stopPropagation();
        const id  = btn.dataset.id;
        const res = await window.imc.deleteRecord(id);
        if (res.success) {
            records = records.filter(r => r.id !== id);
            renderRecords();
            showToast('Registro eliminado', '#f55a5a');
        }
        });
    });
    }

    // ── Exportar CSV ──────────────────────────────────────────────────────────────
    btnExport.addEventListener('click', async () => {
    if (records.length === 0) {
        showToast('⚠️  No hay registros para exportar', '#ff8c00');
        return;
    }
    const res = await window.imc.exportCSV();
    if (res.success) {
        showToast('✓  CSV exportado correctamente');
    } else if (!res.cancelled) {
        showToast('✗  Error al exportar', '#ff4444');
    }
    });

    // ── Inicialización ────────────────────────────────────────────────────────────
    (async () => {
    records = await window.imc.getRecords();
    renderRecords();
    })();
    </script>
    </body>
    </html>
